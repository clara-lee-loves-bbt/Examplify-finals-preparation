<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF3F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17171a" media="(prefers-color-scheme: dark)">
<title>CS1010E — My mistakes</title>
<style>
/* My mistakes — compact, mobile-first study cards; prints to a plain PDF.
   Light mode uses Examplify's own page background (#EEF3F6, as on its results
   screen). The theme follows the device unless the ☀/☾ button picks one, which
   sets data-theme on <html>. */
:root {
  --bg: #EEF3F6;
  --card: #ffffff;
  --ink: #1d1f23;
  --ink-2: #3f4a54;
  --muted: #6f7c87;
  --line: #d9e2e8;
  --chip: #e4ebf0;
  --accent: #2f6f5e;
  --bad: #b3261e;
  --bad-bg: #fbeceb;
  --ok: #1f7a45;
  --ok-bg: #e9f5ee;
  --rule-bg: #fff6df;
  --rule-ink: #6b4e00;
  --code-bg: #f6f8fa;
  --code-num: #a3adb6;
  --tk-kw: #a1255e;
  --tk-bi: #6a3fb0;
  --tk-str: #0b6b3a;
  --tk-num: #9a4a00;
  --tk-com: #8a8a8a;
  --tk-fn: #1f5aa6;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17171a; --card: #212126; --ink: #ececef; --ink-2: #c7c9cf; --muted: #8d929b;
    --line: #34343b; --chip: #2b2b31; --accent: #6cc2a8; --bad: #ff8a80; --bad-bg: #3a2224;
    --ok: #6fd49a; --ok-bg: #1d3327; --rule-bg: #352d17; --rule-ink: #f2d58a;
    --code-bg: #1a1a1e; --code-num: #5d6068;
    --tk-kw: #ff7eb6; --tk-bi: #c3a6ff; --tk-str: #8fe3b0; --tk-num: #ffb86b; --tk-com: #7d8188; --tk-fn: #86b7ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17171a; --card: #212126; --ink: #ececef; --ink-2: #c7c9cf; --muted: #8d929b;
  --line: #34343b; --chip: #2b2b31; --accent: #6cc2a8; --bad: #ff8a80; --bad-bg: #3a2224;
  --ok: #6fd49a; --ok-bg: #1d3327; --rule-bg: #352d17; --rule-ink: #f2d58a;
  --code-bg: #1a1a1e; --code-num: #5d6068;
  --tk-kw: #ff7eb6; --tk-bi: #c3a6ff; --tk-str: #8fe3b0; --tk-num: #ffb86b; --tk-com: #7d8188; --tk-fn: #86b7ff;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
code, pre, .code, .opt-t { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Roboto Mono", monospace; }

/* ---------- top bar ---------- */
.bar {
  position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 92%, transparent);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
  padding-top: env(safe-area-inset-top);
}
.bar-in { max-width: 760px; margin: 0 auto; display: flex; align-items: center; gap: 8px; padding: 8px 12px 6px; }
.back { color: var(--ink-2); text-decoration: none; font-size: 26px; line-height: 1; padding: 0 6px 2px 0; }
.bar-title { flex: 1; font-weight: 700; font-size: 16px; white-space: nowrap; }
.bar-title span { color: var(--muted); font-weight: 500; font-size: 13px; }
.seg { display: flex; background: var(--chip); border-radius: 9px; padding: 2px; }
.seg button { border: 0; background: none; padding: 5px 10px; border-radius: 7px; font-size: 13px; font-weight: 600; color: var(--muted); }
.seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.icon { border: 0; background: var(--chip); width: 34px; height: 32px; border-radius: 9px; font-size: 16px; }
.icon.on { background: var(--accent); color: #fff; }
.filters { max-width: 760px; margin: 0 auto; padding: 0 12px 8px; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.chip {
  flex: none; border: 1px solid var(--line); background: var(--card); border-radius: 999px;
  padding: 4px 10px; font-size: 12.5px; font-weight: 600; color: var(--ink-2); white-space: nowrap;
}
.chip small { color: var(--muted); font-weight: 500; margin-left: 3px; }
.chip.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.chip.on small { color: inherit; opacity: .7; }
.sep { flex: none; width: 1px; background: var(--line); margin: 3px 2px; }

/* ---------- layout ---------- */
.wrap { max-width: 760px; margin: 0 auto; padding: 10px 12px calc(40px + env(safe-area-inset-bottom)); }
.print-head { display: none; }
.lec-head { margin: 18px 2px 8px; font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; }
.patterns { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; margin: 4px 0 6px; }
.patterns summary { padding: 10px 0; font-weight: 700; font-size: 14px; cursor: pointer; }
.pattern { border-top: 1px solid var(--line); padding: 8px 0; font-size: 13.5px; }
.pattern b { display: block; margin-bottom: 2px; }
.pattern p { margin: 0 0 4px; color: var(--ink-2); }
.pattern .refs { color: var(--muted); font-size: 12px; }
.foot { color: var(--muted); font-size: 12.5px; margin-top: 18px; }
.foot a { color: var(--accent); font-weight: 600; }
.empty { color: var(--muted); padding: 20px 4px; }

/* ---------- card ---------- */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px 12px; margin-bottom: 10px; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.meta .lec { font-weight: 700; color: var(--accent); }
.meta .tag { border-radius: 5px; padding: 0 6px; font-weight: 600; font-size: 11px; background: var(--chip); color: var(--ink-2); }
.meta .tag.blank { background: var(--rule-bg); color: var(--rule-ink); }
.title { font-weight: 700; font-size: 15px; margin: 2px 0 6px; }
.stem p { margin: 0 0 6px; font-size: 14px; color: var(--ink-2); }
.stem code, .note code, .pattern code { font-size: .9em; background: var(--chip); border-radius: 4px; padding: 0 4px; overflow-wrap: anywhere; }

.code { background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; margin: 0 0 6px; padding: 6px 0; font-size: 12.5px; line-height: 1.5; }
.cl { display: flex; }
.cn { flex: none; width: 2.1em; padding-right: .7em; text-align: right; color: var(--code-num); user-select: none; -webkit-user-select: none; }
.cc { flex: 1; min-width: 0; padding-right: 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
.tk-kw { color: var(--tk-kw); } .tk-bi { color: var(--tk-bi); } .tk-str { color: var(--tk-str); }
.tk-num { color: var(--tk-num); } .tk-com { color: var(--tk-com); font-style: italic; } .tk-fn { color: var(--tk-fn); font-weight: 600; }
.bk { display: inline-block; text-indent: 0; border: 1.5px dashed var(--accent); color: var(--accent); border-radius: 5px; padding: 0 5px; font-weight: 700; line-height: 1.3; }

/* options: compact list; the two that matter are marked after reveal */
.opts { list-style: none; margin: 2px 0 6px; padding: 0; font-size: 13px; }
.opts li { display: flex; gap: 8px; padding: 3px 8px; border-radius: 6px; border: 1px solid transparent; }
.opts .opt-l { font-weight: 700; color: var(--muted); flex: none; width: 1em; }
.opts .opt-t { flex: 1; min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12.5px; }
.opts .opt-m { flex: none; font-weight: 700; }
.revealed .opts li.yours { background: var(--bad-bg); border-color: color-mix(in srgb, var(--bad) 35%, transparent); }
.revealed .opts li.yours .opt-m { color: var(--bad); }
.revealed .opts li.key { background: var(--ok-bg); border-color: color-mix(in srgb, var(--ok) 35%, transparent); }
.revealed .opts li.key .opt-m { color: var(--ok); }
.revealed .opts li.key .opt-l, .revealed .opts li.yours .opt-l { color: inherit; }

/* fill-in answers: yours (struck) beside the key */
.blanks { margin: 2px 0 6px; display: grid; gap: 3px; font-size: 12.5px; }
.brow { display: grid; grid-template-columns: 1.6em 1fr; gap: 6px; align-items: start; }
.bno { font-weight: 700; color: var(--accent); }
.bval { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.bval code { font-size: 12.5px; padding: 1px 5px; border-radius: 4px; white-space: pre-wrap; overflow-wrap: anywhere; }
.bval .k { background: var(--ok-bg); color: var(--ok); }
.bval .y { background: var(--bad-bg); color: var(--bad); text-decoration: line-through; text-decoration-thickness: 1px; }
.bval .same { background: var(--ok-bg); color: var(--ok); }
.bval .alt { font-size: 11.5px; color: var(--muted); }
.bval .alt code { background: var(--chip); color: var(--ink-2); padding: 0 4px; font-size: 11.5px; }

/* reveal: quiz mode hides the answer part until tapped */
.reveal-btn {
  width: 100%; border: 1px dashed var(--line); background: none; border-radius: 8px; padding: 8px;
  font-size: 13px; font-weight: 600; color: var(--accent); margin-top: 2px;
}
.ans { display: none; }
.revealed .ans { display: block; }
.revealed .reveal-btn { display: none; }
.quiz .card:not(.revealed) .title { display: none; }

/* the three lines: refute the belief, state the fact, give the trigger */
.note { margin-top: 6px; display: grid; gap: 4px; font-size: 13.5px; }
.note div { display: grid; grid-template-columns: 1.3em 1fr; gap: 4px; }
.note .i { font-weight: 800; text-align: center; }
.note .w { color: var(--ink-2); } .note .w .i { color: var(--bad); }
.note .r .i { color: var(--ok); }
.note .rule { background: var(--rule-bg); color: var(--rule-ink); border-radius: 6px; padding: 4px 6px 4px 2px; font-weight: 600; }

@media (min-width: 640px) {
  body { font-size: 15.5px; }
  .code, .opts .opt-t, .blanks, .bval code { font-size: 13px; }
}

/* ---------- print / PDF: everything revealed, compact, no chrome ---------- */
@page { size: A4; margin: 12mm 12mm 14mm; }
@media print {
  /* Same specificity as the dark-theme selectors and later in the file, so a
     printed page is always light whatever theme is on screen. */
  :root, :root[data-theme], :root:not([data-theme="light"]) {
    --bg: #fff; --card: #fff; --ink: #000; --ink-2: #222; --muted: #555; --line: #c9c6bd; --chip: #efede7;
    --accent: #1f5c4d; --bad: #a01c14; --bad-bg: #fbeae8; --ok: #17623a; --ok-bg: #e6f3eb;
    --rule-bg: #fff3d6; --rule-ink: #4d3800; --code-bg: #f7f6f2; --code-num: #999;
    --tk-kw: #8a1a4f; --tk-bi: #5a2f9e; --tk-str: #0a5a31; --tk-num: #7f3d00; --tk-com: #777; --tk-fn: #17488a;
  }
  body { font-size: 9.6pt; line-height: 1.35; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .bar, .patterns summary::marker, .foot, .reveal-btn { display: none !important; }
  .wrap { max-width: none; padding: 0; }
  .print-head { display: block; margin-bottom: 6pt; }
  .print-head h1 { font-size: 15pt; margin: 0 0 2pt; }
  .print-head p { margin: 0; color: var(--muted); font-size: 9pt; }
  .patterns { border: 1px solid var(--line); break-inside: avoid; }
  .patterns > :not(summary) { display: block !important; }
  .ans { display: block !important; }
  .card .title { display: block !important; }
  .card { break-inside: avoid; padding: 6pt 8pt; margin-bottom: 6pt; border-radius: 6pt; }
  .lec-head { break-after: avoid; margin: 10pt 0 4pt; font-size: 9.5pt; color: #333; }
  .code { font-size: 8.4pt; padding: 3pt 0; }
  .opts .opt-t, .blanks, .bval code { font-size: 8.4pt; }
  .stem p, .note { font-size: 9.2pt; }
  .opts li.yours { background: var(--bad-bg) !important; } .opts li.key { background: var(--ok-bg) !important; }
}
</style>
</head>

<script>
/* ===== ../data/registry.js ===== */
/* Shared exam registry.
   Each data file calls registerExam({...}) once, at load time. */
(function () {
  window.EXAMPLIFY_EXAMS = window.EXAMPLIFY_EXAMS || [];
  window.registerExam = function (exam) {
    window.EXAMPLIFY_EXAMS.push(exam);
  };
  /* data/mistakes.js registers the personal mistakes log (notes only). */
  window.registerMistakes = function (log) {
    window.EXAMPLIFY_MISTAKES = log;
  };
})();
</script>
<script>
/* ===== ../data/exam-final-1920.js ===== */
/* FINAL EXAMINATION (Semester 1 : AY 2019/20)
   (file: cs1010e_1920S1_final_exam_soln.pdf)
   24 questions, 100 marks, 2 hours. Q1-20 are the paper's MCQs (3 marks each,
   key taken from the printed answer table); Q21-24 are its four written
   programming questions, converted into fill-in-the-blank form over the same
   skeleton code so that they can be marked here. */
registerExam({
  id: 'final-1920',
  category: 'final',
  title: 'FINAL EXAMINATION (Semester 1 : AY 2019/20)',
  headerName: 'FINAL EXAMINATION (SEM 1 : AY 2019/20)',
  source: 'cs1010e_1920S1_final_exam_soln.pdf',
  duration: 120,
  sections: [
    { name: 'Part I — Multiple choice (3 marks each)', from: 1, to: 20, marks: 3 },
    { name: 'Part II — Programming questions', from: 21, to: 24, marks: 10 }
  ],
  questions: [
    {
      n: 1, marks: 3, type: 'mcq',
      stem: [
        { p: 'What value is produced by executing the following expression?' },
        { code: "2 ** (1 if ('0' if 'False' else '1') else 0) ** 3" }
      ],
      options: [
        { l: 'A', t: '1' }, { l: 'B', t: '2' }, { l: 'C', t: '8' },
        { l: 'D', t: 'Run-time error' }, { l: 'E', t: 'None of the above' }
      ],
      answer: 'B',
      explanation: 'A non-empty string is truthy, so `\'False\'` is true and the inner conditional yields `\'1\'`, which is also truthy and so gives `1`. `**` is right-associative: `2 ** (1 ** 3) = 2`.'
    },
    {
      n: 2, marks: 3, type: 'mcq',
      stem: [
        { p: 'Given the following two assignments to `x`, what integer value should `x` have before assignment in order for the same value to be assigned after executing each assignment?' },
        { code: 'x *= x + 2\n\nx = x * x + 2' }
      ],
      options: [
        { l: 'A', t: '0' }, { l: 'B', t: '1' },
        { l: 'C', t: 'All possible integer values' },
        { l: 'D', t: 'More than one possible answer in choices (A), (B), (C)' },
        { l: 'E', t: 'None of the above' }
      ],
      answer: 'B',
      explanation: 'The first gives `x*(x+2) = x^2 + 2x`, the second `x^2 + 2`. Equating them gives `2x = 2`, so `x = 1` (and `1*3 = 1+2 = 3`).'
    },
    {
      n: 3, marks: 3, type: 'mcq',
      stem: [
        { p: 'Given the following function definition of `shift`, which of the following applications of `shift` will be evaluated successfully?' },
        { code: 'def shift(t,word):\n    return t[2:] + (word,)' }
      ],
      options: [
        { l: 'A', t: "shift('abc','d')" },
        { l: 'B', t: "shift(['w1', 'w2'], 'w3')" },
        { l: 'C', t: "shift(('1',),[[3]])" },
        { l: 'D', t: 'shift( (1), (2) )' },
        { l: 'E', t: 'None of the above' }
      ],
      answer: 'C',
      explanation: 'The `+` requires both operands to be tuples. Only C passes a tuple as `t`; A, B and D pass a string, a list and an integer, which raise `TypeError` when added to the tuple.'
    },
    {
      n: 4, marks: 3, type: 'mcq',
      stem: [
        { p: 'Given the following Ackermann function definition, how many times is `ack` called during the execution of `ack(1,2)`, including the first call?' },
        { code: 'def ack(m,n):\n    if m == 0:\n        return n+1\n    elif m > 0 and n == 0:\n        return ack(m-1,1)\n    else:\n        return ack(m-1,ack(m,n-1))' }
      ],
      options: [
        { l: 'A', t: '4' }, { l: 'B', t: '6' }, { l: 'C', t: '8' },
        { l: 'D', t: 'Infinite, since execution enters an infinite loop' },
        { l: 'E', t: 'None of the above' }
      ],
      answer: 'B',
      explanation: '`ack(1,2)` calls `ack(1,1)`, which calls `ack(1,0)` and `ack(0,1)`; the inner result then needs `ack(0,3)` and finally `ack(0,4)` — six calls in all.'
    },
    {
      n: 5, marks: 3, type: 'mcq',
      stem: [
        { p: 'The following function has the following input-output behaviour. What does it do?' },
        { code: 'def madness(nums):\n    nums = sorted(nums)\n    res = {}\n    i = 0\n    while i < len(nums)-2:\n        j, k = i+1, len(nums)-1\n        while j < k:\n            if nums[i] + nums[j] + nums[k] == 0:\n                res[(nums[i],nums[j],nums[k])] = True\n                j += 1\n                k -= 1\n            elif (nums[i] + nums[j] + nums[k] < 0):\n                j += 1\n            else:\n                k -= 1\n        i += 1\n    return list(res.keys())' }
      ],
      options: [
        { l: 'A', t: 'It returns a tuple containing the minimum, maximum and middle elements in the list' },
        { l: 'B', t: 'It returns just one tuple of three elements in the input list whose sum is 0' },
        { l: 'C', t: 'It returns all tuples of three elements in the input list whose sum is 0' },
        { l: 'D', t: 'It returns some, but not necessarily all, tuples of 3 elements in the input list whose sum is 0' },
        { l: 'E', t: 'None of the above' }
      ],
      answer: 'C',
      explanation: 'This is the classic 3-sum sweep: the two-pointer scan visits every viable triple, and the dict de-duplicates them, so every triple summing to zero is reported once.'
    },
    {
      n: 6, marks: 3, type: 'mcq',
      stem: [
        { p: 'What is the result of evaluating the following expression?' },
        { code: '(lambda x: (lambda x : x)(lambda x: x+x)(x))(2)' }
      ],
      options: [
        { l: 'A', t: '0' }, { l: 'B', t: '2' }, { l: 'C', t: '4' },
        { l: 'D', t: '(lambda x:x+x)' }, { l: 'E', t: 'Run time error occurs' }
      ],
      answer: 'C',
      explanation: 'The inner `(lambda x: x)` returns its argument unchanged, i.e. the function `lambda x: x+x`, which is then called with the outer `x = 2`, giving 4.'
    },
    {
      n: 7, marks: 3, type: 'mcq',
      stem: [
        { p: 'What is the result of executing the function call `crack(8, lambda x: x)`?' },
        { code: 'def crack(n,g):\n    if n % 5:\n        return crack(n+1,g(g))\n    else:\n        return g(n)' }
      ],
      options: [
        { l: 'A', t: '10' }, { l: 'B', t: '9' }, { l: 'C', t: '8' },
        { l: 'D', t: 'Run-time error' }, { l: 'E', t: 'None of the above' }
      ],
      answer: 'A',
      explanation: '`g(g)` is still the identity, so it climbs 8, 9, 10 and then returns `g(10) = 10`, the first multiple of 5.'
    },
    {
      n: 8, marks: 3, type: 'mcq',
      stem: [
        { p: 'Given that `oldmat` is a 4x4 integer matrix in which every integer is unique, where is the value of `oldmat[0][0]` stored in the resulting matrix?' },
        { code: 'def confuse(mat):\n    return [ mat[len(mat)-i-1][::-1]\n             for i in range(len(mat)) ]\n\nnewMat = confuse(oldmat)' }
      ],
      options: [
        { l: 'A', t: 'newMat[0][0]' }, { l: 'B', t: 'newMat[0][3]' },
        { l: 'C', t: 'newMat[3][0]' }, { l: 'D', t: 'newMat[3][3]' },
        { l: 'E', t: 'Run time error' }
      ],
      answer: 'D',
      explanation: 'The rows are taken from the bottom up, and each row is reversed — a 180-degree rotation. `oldmat[0][0]` therefore lands at the bottom-right corner.'

<script>

/* My mistakes — one compact card per mistake, built from the paper data

   Quiz mode hides the answer and the note until tapped (retrieval first);
   Read mode shows everything; Print always shows everything.
   View settings are kept in localStorage under their own key — saved exam

(function () {

  function norm(s) { return String(s == null ? '' : s).replace(/[‘’“”]/g, "'").replace(/"/g, "'").replace(/\s+/g, ''); }
  function paperOf(id) { for (var i = 0; i < EXAMS.length; i++) if (EXAMS[i].id === id) return EXAMS[i]; return null; }

  function saveView() { try { localStorage.setItem(VIEW_KEY, JSON.stringify(view)); } catch (e) { /* ignore */ } }

  /* ---------------- Python highlighting (soft-wrapped, hanging indent) ---------------- */

  ('print len range tuple list dict map filter sum max min abs int str float type isinstance super ord chr input round sorted reversed enumerate zip id set bool reduce all any self').split(' ').forEach(function (w) { BI[w] = 1; });
  var TOK = /(#[^\n]*)|([rRbBfF]{0,2}'(?:\\.|[^'\\\n])*'|[rRbBfF]{0,2}"(?:\\.|[^"\\\n])*")|(\{\{\d+\}\})|(\d[\d_]*(?:\.\d+)?(?:[eE][-+]?\d+)?)|([A-Za-z_]\w*)|(\n)|([^\S\n]+)|([\s\S])/g;
  function highlight(code) {
    var lines = [''], prev = '', m;
    TOK.lastIndex = 0;
    while ((m = TOK.exec(code))) {
      var h;
      if (m[1]) h = '<span class="tk-com">' + esc(m[1]) + '</span>';

      else if (m[4]) h = '<span class="tk-num">' + esc(m[4]) + '</span>';
      else if (m[5]) {
        var w = m[5];

  }

        var cls = (o.l === q.answer ? 'key' : '') + (m.given === o.l ? ' yours' : '');
        var mark = o.l === q.answer ? '✓' : (m.given === o.l ? '✗' : '');
        return '<li class="' + cls.trim() + '"><span class="opt-l">' + o.l + '</span><span class="opt-t">' + esc(o.t) +
          '</span><span class="opt-m ans">' + mark + '</span></li>';
      }).join('') + '</ul>';
    }

    h += '<button type="button" class="reveal-btn">Show answer &amp; note</button>';
    h += '<div class="ans">';
    if (q.type !== 'mcq') {
      h += '<div class="blanks">' + q.blanks.map(function (b, i) {
        var yours = Array.isArray(m.given) ? m.given[i] : null;
        var has = yours != null && String(yours).trim() !== '';
        var same = has && norm(yours) === norm(b.answer);
        var fine = has && !same && (m.fine || []).indexOf(b.n) >= 0;
        var val;
        if (fine) val = '<code class="same">' + esc(yours) + '</code><span class="alt">✓ yours works too · key: <code>' + esc(b.answer) + '</code></span>';
        else {
          val = '<code class="' + (same ? 'same' : 'k') + '">' + esc(b.answer) + '</code>';
          if (has && !same) val += '<code class="y">' + esc(yours) + '</code>';
        }
        return '<div class="brow"><span class="bno">' + (CIRCLED[b.n] || b.n) + '</span><span class="bval">' + val + '</span></div>';
      }).join('') + '</div>';
    } else if (m.kind === 'skipped') {
      h += '<div class="blanks"><div class="brow"><span class="bno">✓</span><span class="bval"><code class="k">' +
        esc(q.answer + '. ' + optText(q, q.answer)) + '</code></span></div></div>';
    }
    h += '<div class="note">' +
      '<div class="w"><span class="i">✗</span><span>' + inline(m.wrong) + '</span></div>' +
      '<div class="r"><span class="i">✓</span><span>' + inline(m.right) + '</span></div>' +
      '<div class="rule"><span class="i">→</span><span>' + inline(m.rule) + '</span></div>' +
      '</div></div></article>';
    return h;
  }
  function optText(q, l) { for (var i = 0; i < q.options.length; i++) if (q.options[i].l === l) return q.options[i].t; return ''; }

  /* ---------------- filters + list ---------------- */
  function items() {
    return LOG.items.filter(function (m) { return paperOf(m.paper) && questionOf(m); });
  }
  function matches(m) {
    if (view.lec && m.lec !== view.lec) return false;
    if (view.paper && m.paper !== view.paper) return false;
    if (view.type && m.type !== view.type) return false;
    return true;
  }
  function chip(label, count, on, attrs) {
    return '<button type="button" class="chip' + (on ? ' on' : '') + '" ' + attrs + '>' + label +
      (count != null ? '<small>' + count + '</small>' : '') + '</button>';
  }
  function renderFilters() {
    var all = items();
    var lecs = {}, papers = {}, types = {};
    all.forEach(function (m) {
      lecs[m.lec] = (lecs[m.lec] || 0) + 1;
      papers[m.paper] = (papers[m.paper] || 0) + 1;
      types[m.type] = (types[m.type] || 0) + 1;
    });
    var h = chip('All', all.length, !view.lec && !view.paper && !view.type, 'data-f="all"');
    h += '<span class="sep"></span>';
    Object.keys(lecs).map(Number).sort(function (a, b) { return a - b; }).forEach(function (l) {
      h += chip('L' + l, lecs[l], view.lec === l, 'data-f="lec" data-v="' + l + '" title="' + esc(LEC[l]) + '"');
    });
    h += '<span class="sep"></span>';
    EXAMS.filter(function (e) { return papers[e.id]; }).forEach(function (e) {
      h += chip(short(e), papers[e.id], view.paper === e.id, 'data-f="paper" data-v="' + e.id + '"');
    });
    h += '<span class="sep"></span>';
    ['concept', 'trace', 'blank'].forEach(function (t) {
      if (types[t]) h += chip(TYPE[t], types[t], view.type === t, 'data-f="type" data-v="' + t + '"');
    });
    $('filters').innerHTML = h;
  }

  function renderList() {
    var list = items().filter(matches);
    $('count').textContent = list.length + (list.length === items().length ? '' : ' of ' + items().length);
    if (!list.length) { $('list').innerHTML = '<p class="empty">Nothing matches these filters.</p>'; return; }
    var h = '';
    if (shuffled) {
      var order = shuffled.filter(function (k) { return list.some(function (m) { return m.paper + ':' + m.n === k; }); });
      h += '<div class="lec-head"><span>Shuffled — lectures mixed</span><span>' + order.length + '</span></div>';
      order.forEach(function (k) { h += card(list.filter(function (m) { return m.paper + ':' + m.n === k; })[0]); });
    } else {
      var by = {};
      list.forEach(function (m) { (by[m.lec] = by[m.lec] || []).push(m); });
      Object.keys(by).map(Number).sort(function (a, b) { return a - b; }).forEach(function (l) {
        h += '<div class="lec-head"><span>L' + l + ' · ' + esc(LEC[l]) + '</span><span>' + by[l].length + '</span></div>';
        by[l].forEach(function (m) { h += card(m); });
      });
    }
    $('list').innerHTML = h;
  }

  function renderPatterns() {
    var p = LOG.patterns || [];
    if (!p.length) { $('patterns').hidden = true; return; }
    var h = '<summary>' + p.length + ' patterns that repeat across papers</summary>';
    p.forEach(function (x) {
      var refs = (x.refs || []).map(function (r) {
        var b = r.split(':'), e = paperOf(b[0]);
        return e ? short(e) + ' Q' + b[1] : r;
      }).join(' · ');
      h += '<div class="pattern"><b>' + inline(x.title) + '</b><p>' + inline(x.text) + '</p><div class="refs">' + refs + '</div></div>';
    });
    $('patterns').innerHTML = h;
  }

  function renderMode() {
    document.body.classList.toggle('quiz', view.mode === 'quiz');
    document.querySelectorAll('.seg button').forEach(function (b) { b.classList.toggle('on', b.dataset.mode === view.mode); });
    document.querySelectorAll('.card').forEach(function (c) { c.classList.toggle('revealed', view.mode === 'read'); });
    $('shuffle').classList.toggle('on', !!shuffled);
  }

  function render() { renderFilters(); renderList(); renderMode(); }

  /* Theme: follow the device until the button picks light or dark. */
  var darkQuery = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  function isDark() { return view.theme ? view.theme === 'dark' : !!(darkQuery && darkQuery.matches); }
  function applyTheme() {
    if (view.theme) document.documentElement.setAttribute('data-theme', view.theme);
    else document.documentElement.removeAttribute('data-theme');
    var b = $('theme');
    b.innerHTML = isDark() ? '&#9728;' : '&#9790;';
    b.title = isDark() ? 'Switch to light mode' : 'Switch to dark mode';
    b.setAttribute('aria-label', b.title);
  }
  if (darkQuery && darkQuery.addEventListener) darkQuery.addEventListener('change', applyTheme);

  /* ---------------- events ---------------- */
  document.addEventListener('click', function (ev) {
    var t = ev.target.closest('button');
    if (!t) return;
    if (t.classList.contains('reveal-btn')) { t.closest('.card').classList.add('revealed'); return; }
    if (t.dataset.mode) { view.mode = t.dataset.mode; saveView(); renderMode(); return; }
    if (t.id === 'shuffle') {
      if (shuffled) shuffled = null;
      else {
        shuffled = items().map(function (m) { return m.paper + ':' + m.n; });
        for (var i = shuffled.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var x = shuffled[i]; shuffled[i] = shuffled[j]; shuffled[j] = x; }
      }
      renderList(); renderMode(); window.scrollTo(0, 0); return;
    }
    if (t.id === 'print') { window.print(); return; }
    if (t.id === 'theme') { view.theme = isDark() ? 'light' : 'dark'; saveView(); applyTheme(); return; }
    if (t.dataset.f) {
      var f = t.dataset.f, v = t.dataset.v;
      if (f === 'all') { view.lec = 0; view.paper = ''; view.type = ''; }
      else if (f === 'lec') view.lec = view.lec === +v ? 0 : +v;
      else if (f === 'paper') view.paper = view.paper === v ? '' : v;
      else if (f === 'type') view.type = view.type === v ? '' : v;
      saveView(); render(); return;
    }
  });

  // Printing always shows the full list in lecture order with every answer.
  var before = null;
  window.addEventListener('beforeprint', function () {
    before = { view: JSON.stringify(view), shuffled: shuffled };
    if (!/[?&]keep\b/.test(location.search)) { view.lec = 0; view.paper = ''; view.type = ''; }
    shuffled = null; renderList(); renderMode();
    $('patterns').open = true;
  });
  window.addEventListener('afterprint', function () {
    if (!before) return;
    view = JSON.parse(before.view); shuffled = before.shuffled; before = null; render();
  });

  var papers = {};
  items().forEach(function (m) { papers[m.paper] = 1; });
  $('print-meta').textContent = items().length + ' questions from the ' +
    EXAMS.filter(function (e) { return papers[e.id]; }).map(short).join(', ') +
    ' finals · grouped by lecture · ✗ what I thought · ✓ what is true · → rule · updated ' + (LOG.compiled || '');

  // ?print opens straight in print layout (used to build mistakes.pdf).
  if (/[?&]print\b/.test(location.search)) { view = { mode: 'read', lec: 0, paper: '', type: '', theme: 'light' }; }
  applyTheme();
  renderPatterns();
  render();
  if (/[?&]print\b/.test(location.search)) $('patterns').open = true;
})();
</script>
</body>
</html>
